version: 1

settings:
  report_dir: /Users/vincentdesbrosses/Documents/Misc/ai-system/reports
  scan_backups: true
  scan_symlinks: true
  generate_markdown: true
  generate_json: true

  # Manifest central contenant la metadata canonique.
  # Les fichiers runtime Claude/Codex ne doivent contenir que name + description.
  skills_manifest: /Users/vincentdesbrosses/Documents/Misc/ai-system/skills-manifest.yml

projects:
  - name: aimoto
    root: /Users/vincentdesbrosses/Documents/Misc/aimoto
    enabled: true
    paths:
      codex_skills: .agents/skills
      claude_commands: .claude/commands
      claude_rules: .claude/rules
      claude_strategy_profiles: .claude/strategy-profiles
      claude_hooks: .claude/hooks
      codex_hooks: .codex/hooks
      agents_file: AGENTS.md
      claude_file: CLAUDE.md
      project_config: .claude/project-config.md
      architecture_file: docs/ARCHITECTURE.md

  - name: InterviewOS
    root: /Users/vincentdesbrosses/Documents/Misc/InterviewOS
    enabled: true
    paths:
      codex_skills: .agents/skills
      claude_commands: .claude/commands
      claude_rules: .claude/rules
      claude_strategy_profiles: .claude/strategy-profiles
      claude_hooks: .claude/hooks
      codex_hooks: .codex/hooks
      agents_file: AGENTS.md
      claude_file: CLAUDE.md
      project_config: .claude/project-config.md
      architecture_file: docs/ARCHITECTURE.md

  - name: intrai
    root: /Users/vincentdesbrosses/Documents/Misc/intrai
    enabled: false

  - name: linkedin-ia-comments
    root: /Users/vincentdesbrosses/Documents/Misc/linkedin-ia-comments
    enabled: false

  - name: Pylaa
    root: /Users/vincentdesbrosses/Documents/Misc/Pylaa
    enabled: false

  - name: Pylot
    root: /Users/vincentdesbrosses/Documents/Misc/Pylot
    enabled: false

  - name: Skriipt
    root: /Users/vincentdesbrosses/Documents/Misc/Skriipt
    enabled: false

  - name: Spotter
    root: /Users/vincentdesbrosses/Documents/Misc/Spotter
    enabled: false

  - name: suggst
    root: /Users/vincentdesbrosses/Documents/Misc/suggst
    enabled: false

  - name: truthify
    root: /Users/vincentdesbrosses/Documents/Misc/truthify
    enabled: false

shared_sources:
  - name: claude-commands
    root: /Users/vincentdesbrosses/Documents/Misc/claude-commands
    artifact_type: claude_command
    enabled: true

matching:
  equivalent_pairs:
    - claude_type: claude_command
      codex_type: codex_skill
      strategy: same_normalized_name

  name_normalization:
    strip_prefixes:
      - "/"
    strip_suffixes:
      - ".md"
      - "/SKILL.md"

quality_rules:
  # Les fichiers runtime Claude/Codex doivent rester compatibles avec leurs outils.
  # On exige donc uniquement un frontmatter minimal.
  #
  # Metadata complète déplacée dans :
  # /Users/vincentdesbrosses/Documents/Misc/ai-system/skills-manifest.yml
  metadata_required_for:
    - codex_skill
    - claude_command

  required_frontmatter_fields:
    - name
    - description

  recommended_frontmatter_fields: []

  # Ces patterns ne prouvent pas une erreur.
  # Ils signalent seulement un point à auditer manuellement ou via ai_doctor.py.
  forbidden_silent_fallback_patterns:
    - "par défaut"
    - "fallback"
    - "default to"
    - "si absent"
    - "if absent"
    - "dernière stratégie mentionnée"
    - "latest mentioned strategy"
    - "utiliser MMXM"
    - "use MMXM"

  project_specific_terms:
    aimoto:
      - "aimoto"
      - "aimoto-v2"
      - "BTC"
      - "BTCUSD"
      - "BTC-USD"
      - "MMXM"
      - "silver_bullet"
      - "backend/app/algo"
      - ".claude/strategy-profiles"
      - "walk_forward.py"

  ignore_names:
    - ".DS_Store"

  backup_patterns:
    - ".backup"
    - ".backup-project-specific"
    - ".v3-backup"
    - ".bak-ai-frontmatter"

pairing_rules:
  # Les exports Claude/Codex n'ont pas besoin d'avoir le même hash.
  # Ils peuvent être adaptés à leur runtime respectif.
  #
  # L'équivalence se fait via skills-manifest.yml :
  # - canonical_id
  # - version
  # - source_of_truth
  compare_claude_codex_by:
    - canonical_id
    - version
    - source_of_truth

  hash_policy:
    raw_export_hash_is_informational: true
    same_hash_required_only_for_same_export_target: true

reporting:
  include:
    - summary
    - pair_status_summary
    - claude_codex_pairs
    - issues
    - symlinks
    - recommended_next_actions

  issue_severity_policy:
    missing_runtime_frontmatter: warning
    missing_runtime_name: warning
    missing_runtime_description: warning
    missing_manifest_entry: warning
    semantic_review_needed: info
    missing_codex_skill: warning
    missing_claude_command: warning
    fallback_candidate: warning
    broken_symlink: error